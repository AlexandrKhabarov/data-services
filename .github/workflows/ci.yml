name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & format & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - run: make lint
        working-directory: backend

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - run: make test
        working-directory: backend
