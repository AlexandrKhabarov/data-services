[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-services-backend"
version = "0.1.0"
description = "Telegram photo analysis proxy service"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.114.2",
    "sqlmodel>=0.0.21",
    "pydantic>=2.0",
    "pydantic-settings>=2.2.1",
    "psycopg[binary]>=3.1.13",
    "alembic>=1.12.1",
    "python-multipart>=0.0.7",
    "telethon>=1.36.0",
    "cryptography>=42.0.0",
    "httpx>=0.25.1",
    "tenacity>=8.2.3",
    "sentry-sdk[fastapi]>=2.0.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.0.0",
    "coverage[toml]>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI's Depends() in function defaults is idiomatic and intentional
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
